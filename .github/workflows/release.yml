name: Build apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: android
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac app
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: macos/BridgeLink-mac.zip

  publish:
    if: always() && !cancelled() && (needs.android.result == 'success' || needs.mac.result == 'success')
    needs: [android, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Attach whichever apps built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF}" = "${GITHUB_REF#refs/tags/v}" ]; then
            TAG="v0.2.0"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          files=()
          if [ -f android-apk/app-debug.apk ]; then
            mv android-apk/app-debug.apk BridgeLink-android.apk
            files+=(BridgeLink-android.apk)
          fi
          if [ -f mac-app/BridgeLink-mac.zip ]; then
            mv mac-app/BridgeLink-mac.zip BridgeLink-mac.zip
            files+=(BridgeLink-mac.zip)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No artifacts"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
