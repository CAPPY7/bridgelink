name: Build apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac app
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: macos/BridgeLink-mac.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Attach both apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv android-apk/app-debug.apk BridgeLink-android.apk
          mv mac-app/BridgeLink-mac.zip BridgeLink-mac.zip
          gh release upload "${GITHUB_REF_NAME}" BridgeLink-android.apk BridgeLink-mac.zip --clobber
