name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Versions match
        run: |
          python3 scripts/check-versions.py
          python3 scripts/check-matrix.py
          python3 scripts/check-share.py
      - name: Unit tests, lint, and release APK
        working-directory: android
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          chmod +x gradlew
          KEYSTORE="$RUNNER_TEMP/ci.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -alias bridgelink -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=BridgeLink CI" 
          ./gradlew lint test assembleRelease assembleDebugAndroidTest --no-daemon \
            -PRELEASE_STORE_FILE="$KEYSTORE" \
            -PRELEASE_STORE_PASSWORD=android \
            -PRELEASE_KEY_ALIAS=bridgelink \
            -PRELEASE_KEY_PASSWORD=android

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test and build a universal app
        env:
          MAC_SIGN_P12_BASE64: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: bash macos/build.sh
      - name: Upload Mac screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-screenshots
          path: docs/screenshots/mac-*.png
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:auth
      - run: npm run typecheck
      - run: npm test

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-x86_64-google-apis-v1
      - name: Pair, send a note, forget, and pair again
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash android/emulator-ci.sh
      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-screenshots
          path: docs/screenshots/android-*.png
          if-no-files-found: ignore
