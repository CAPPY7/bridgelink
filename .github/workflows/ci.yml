name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Versions match
        run: python3 scripts/check-versions.py
      - name: Unit tests, lint, and release APK
        working-directory: android
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          chmod +x gradlew
          KEYSTORE="$RUNNER_TEMP/ci.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -alias bridgelink -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=BridgeLink CI" 
          ./gradlew lint test assembleRelease --no-daemon \
            -PRELEASE_STORE_FILE="$KEYSTORE" \
            -PRELEASE_STORE_PASSWORD=android \
            -PRELEASE_KEY_ALIAS=bridgelink \
            -PRELEASE_KEY_PASSWORD=android

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test and build a universal app
        run: bash macos/build.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - name: Demo protocol tests
        run: node --experimental-strip-types --test src/lib/bridgelink/protocol.test.ts
