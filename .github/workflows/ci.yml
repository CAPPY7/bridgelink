name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Versions match
        run: python3 scripts/check-versions.py
      - name: Unit tests and debug APK
        working-directory: android
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test and build a universal app
        run: bash macos/build.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - name: Demo protocol tests
        run: node --experimental-strip-types --test src/lib/bridgelink/protocol.test.ts
