version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: swift
    directory: /macos
    schedule:
      interval: weekly
    groups:
      minor:
        update-types:
          - minor
          - patch
